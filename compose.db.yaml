name: db_assignment4

services:
  postgres:
    image: postgres:18-alpine
    env_file:
      - .env
    restart: always
    ports:
      - $POSTGRES_PORT:5432
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 10s
    networks:
      - db_network

  adminer:
    image: adminer:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy 
    ports:
      - 8081:8080
    networks:
      - db_network

networks:
  db_network:
    driver: bridge

volumes:
  db: